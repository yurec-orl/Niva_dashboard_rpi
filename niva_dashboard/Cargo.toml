[package]
name = "niva_dashboard"
version = "0.1.0"
edition = "2021"

[features]
# Command-line `test=<name>` diagnostics (src/test/run_test.rs + the opengl_test.rs
# helpers it exclusively uses). Off by default to keep normal builds lean; enable with
# `cargo build --features cli_tests` to bring them back.
cli_tests = []

[dependencies]
crossterm = "0.27"
crossbeam-channel = "0.5"
drm = "0.11"
freetype-sys = "0.13"
gbm-rs = "0.2"
gl = "0.14"
image = "0.24"
libc = "0.2"
rppal = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4"
flexi_logger = "0.31.9"
log = "0.4.33"
