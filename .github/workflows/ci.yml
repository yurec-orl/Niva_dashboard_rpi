name: CI

on:
  push:
    branches: [master]

jobs:
  test:
    # ARM64 runner: this crate's raw OpenGL FFI calls rely on c_char being
    # unsigned, true on ARM (matching the Pi target) but not on x86_64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libdrm-dev \
            libgbm-dev \
            libfreetype6-dev \
            libudev-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: niva_dashboard

      - name: Run tests
        working-directory: niva_dashboard
        run: cargo test --verbose
