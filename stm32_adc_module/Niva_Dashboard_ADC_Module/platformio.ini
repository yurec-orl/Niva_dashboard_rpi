; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
extra_scripts = pre:git_rev.py
build_flags =
    -DUSBCON
    -DUSBD_USE_CDC
    ; Force single-buffered CDC OUT. The stm32duino default (double-buffered on
    ; STM32F1) wedges the OUT endpoint in the HAL "Blocking State" (DTOG_RX ==
    ; SW_BUF) and NAKs every host->device packet forever — the Pi cannot send
    ; commands. See the Build & Upload note in src/main.cpp.
    -DUSBD_CDC_USE_SINGLE_BUFFER
lib_deps =
    paulstoffregen/OneWire@^2.3.8
